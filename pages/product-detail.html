<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - Camera Hut</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/product-detail.css">
</head>
<body>
    <!-- HEADER -->
    <div id="header-placeholder"></div>

    <main class="page-container">
        <!-- ĐIỀU HƯỚNG BREADCRUMB -->
        <nav class="breadcrumb">
            <a href="products.html">Trang chủ</a> <span>&gt;</span>
            <span id="bcCategory">Danh mục</span> <span>&gt;</span>
            <strong id="bcName">Đang tải...</strong>
        </nav>

        <!-- KHỐI CHÍNH: ẢNH VÀ ĐẶT HÀNG -->
        <section class="main-product-layout" id="mainProductView">
            <div class="loading-state">Đang tải thông tin sản phẩm...</div>
        </section>

        <!-- KHỐI 1: PHỤ KIỆN KHUYÊN DÙNG (CÙNG HÃNG) -->
        <section class="sub-block-card">
            <h2 class="sub-block-title" id="accessoriesTitle">Phụ kiện khuyên dùng</h2>
            <div class="product-slider-grid" id="accessoriesList"></div>
        </section>

        <!-- KHỐI 2: MÔ TẢ CHI TIẾT (CÓ TABLE OF CONTENTS) & THÔNG SỐ KỸ THUẬT -->
        <section class="detail-specs-grid">
            <div class="sub-block-card desc-main-card">
                <h2 class="sub-block-title">Mô tả chi tiết sản phẩm</h2>
                <div class="desc-flex-wrapper">
                    <aside class="toc-sidebar" id="tocSidebar" style="display: none;">
                        <div class="toc-box">
                            <div class="toc-heading">NỘI DUNG CHÍNH</div>
                            <ul class="toc-list" id="tocList"></ul>
                        </div>
                    </aside>

                    <div class="article-content-area">
                        <div class="article-collapse-box collapsed" id="articleCollapseBox">
                            <div id="richArticleContent"></div>
                            <div class="article-fade-mask"></div>
                        </div>

                        <div class="expand-btn-row">
                            <button type="button" class="btn-outline-more" id="btnToggleDesc" onclick="toggleDescriptionExpand()">
                                XEM THÊM <span>▾</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <aside class="specs-right-column">
                <div class="sub-block-card specs-summary-card">
                    <h2 class="sub-block-title">Thông số kỹ thuật</h2>
                    <table class="specs-mini-table" id="specsMiniTable"></table>
                    <button type="button" class="btn-outline-more full-width" onclick="openSpecModal()">
                        XEM THÊM
                    </button>
                </div>

                <div class="sub-block-card inbox-card">
                    <h3 class="inbox-title">Trong hộp bao gồm</h3>
                    <ul class="inbox-list" id="inBoxList"></ul>
                </div>
            </aside>
        </section>

        <!-- KHỐI 3: ĐÁNH GIÁ & BÌNH LUẬN -->
        <section class="sub-block-card">
            <h2 class="sub-block-title">Đánh giá & Bình luận</h2>
            <div class="tab-text-desc" id="reviewContentBox"></div>
        </section>

        <!-- KHỐI 4: SẢN PHẨM TƯƠNG TỰ (CHỈ CÙNG HÃNG) -->
        <section class="sub-block-card">
            <h2 class="sub-block-title text-center" id="relatedTitle">SẢN PHẨM CÙNG THƯƠNG HIỆU</h2>
            <div class="product-slider-grid" id="relatedList"></div>
        </section>
    </main>

    <!-- LỚP PHỦ THÔNG SỐ KỸ THUẬT (BẤM RA NGOÀI ĐỂ ĐÓNG) -->
    <div class="spec-modal-overlay" id="specModalOverlay" onclick="closeSpecModal()">
        <div class="spec-modal-dialog" onclick="event.stopPropagation()">
            <div id="specModalBody"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <div id="footer-placeholder"></div>
    <script src="../js/main.js"></script>
    <script src="../js/product-detail.js"></script>
    <script src="../js/include.js"></script>
</body>
</html>
